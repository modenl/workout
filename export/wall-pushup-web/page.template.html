<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ee"><meta name="description" content="长者形象的墙面俯卧撑3D动作示范，可离线播放、暂停、调速和旋转视角。">
<title>墙面俯卧撑 · 长者动作示范</title>
<style>
:root{color-scheme:light;--paper:#f5f4ee;--ink:#243e34;--muted:#627168;--green:#345b48;--line:#d9ded3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #b28139;outline-offset:4px}main{max-width:1120px;margin:auto;min-height:100svh;padding:32px 40px 22px;display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto 1fr auto;gap:0 40px}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:13px;letter-spacing:2px;color:var(--muted);margin:0 0 7px}h1{font-size:30px;line-height:1.3;font-weight:650;letter-spacing:1px;margin:0}.tag{font-size:14px;color:var(--muted)}.viewer{position:relative;min-width:0;min-height:420px;height:min(68vh,670px);align-self:center}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;margin:0}.views{position:absolute;left:8px;top:20px;display:flex;gap:7px}.views button{background:#f5f4eedb;border:1px solid var(--line);border-radius:30px;min-height:44px;padding:0 17px;font-size:14px;color:var(--ink)}.views button[aria-pressed=true]{background:#e4e9dd;border-color:#a4b7a5}.controls{align-self:center;padding:28px 0}.step{font-size:13px;color:var(--muted);letter-spacing:2px;margin-bottom:12px}.phase{font-size:27px;font-weight:600;margin:0 0 12px}.cue{font-size:17px;line-height:1.8;color:var(--muted);min-height:64px;margin:0 0 24px}.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}input[type=range]{width:100%;height:34px;accent-color:var(--green);margin:3px 0 17px;cursor:pointer}.play{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--green);color:white;border:0;border-radius:13px;min-height:56px;width:100%;font-size:19px;font-weight:600;transition:background .18s}.play:hover{background:#284b39}.play svg{width:20px;height:20px;fill:currentColor}.secondary{display:flex;gap:10px;margin-top:11px}.secondary button{flex:1;min-height:48px;border:1px solid #c9d2c5;border-radius:12px;background:transparent;color:var(--ink);font-size:16px}.secondary button[aria-pressed=true]{background:#e4e9dd}.instruction{font-size:15px;line-height:1.9;border-top:1px solid var(--line);padding-top:22px;margin-top:28px;color:var(--muted)}footer{grid-column:1/-1;border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;gap:14px;font-size:12px;color:var(--muted)}.error{position:absolute;inset:20%;background:var(--paper);padding:24px;line-height:1.8;border:1px solid var(--line);border-radius:12px}.error[hidden]{display:none}noscript{display:block;padding:24px}.paused-note{display:inline-block;font-size:12px;letter-spacing:0;background:#e4e9dd;border-radius:4px;padding:2px 5px;margin-left:8px}.paused-note[hidden]{display:none}@media(max-width:700px){main{padding:20px 18px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:0}header{padding-bottom:15px}.eyebrow{font-size:11px;margin-bottom:5px}h1{font-size:25px}.tag{font-size:12px}.viewer{width:100%;height:45svh;min-height:280px;max-height:440px}.views{top:12px;left:0}.views button{min-height:40px;padding:0 14px;font-size:13px}.hint{bottom:0;font-size:12px}.controls{width:100%;padding:17px 0 20px}.step{font-size:11px;margin-bottom:7px}.phase{font-size:23px;margin-bottom:5px}.cue{font-size:15px;min-height:0;line-height:1.6;margin-bottom:14px}.play{min-height:53px;font-size:18px}.secondary button{min-height:46px}.instruction{margin-top:18px;padding-top:14px;font-size:14px}footer{font-size:11px;padding-top:13px}.progress-la </style>
</head>
<body><main>
<header><div><p class="eyebrow">每日动一动 · 动作示范</p><h1>墙面俯卧撑</h1></div><span class="tag">长者版</span></header>
<section class="viewer" aria-label="可旋转的三维动作示范">
<canvas id="canvas" tabindex="0" aria-label="长者示范墙面俯卧撑。拖动旋转视角，双指缩放；键盘方向键可旋转。"></canvas>
<div class="views" role="group" aria-label="观察视角"><button id="side" aria-pressed="false">侧面</button><button id="angle" aria-pressed="true">斜侧面</button></div>
<p class="hint">拖动看不同角度 · 双指缩放</p><div id="error" class="error" role="alert" hidden></div>
</section>
<section class="controls" aria-label="播放控制">
<div class="step"><span id="step">动作 01 / 02</span><span class="paused-note" id="paused" hidden>已暂停</span></div>
<h2 class="phase" id="phase">屈肘，缓慢靠近</h2><p class="cue" id="cue">双手稳稳贴墙，让身体整体向墙面靠近。</p>
<div class="progress-label"><label for="seek">动作进度</label><span id="timing">3 秒靠近 · 3 秒推回</span></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="拖动查看动作进度">
<button class="play" id="play" aria-label="暂停动画"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg><span id="play-text">暂停示范</span></button>
<div class="secondary"><button id="slow" aria-pressed="false">慢速播放</button><button id="reset">重新开始</button></div>
<p class="instruction">双手与肩同高，双脚站稳。<br>保持身体成一直线，动作缓慢连贯。</p>
</section><footer><span>可离线使用 · 支持触屏操作</span><span>3D 动作示范</span></footer>
</main><noscript>请在浏览器中启用 JavaScript，以播放三维动作演示。</noscript>
<script id="scene-data" type="application/json">__SCENE__</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('scene-data').textContent),canvas=document.getElementById('canvas'),$=id=>document.getElementById(id);
const fail=message=>{$('error').hidden=false;$('error').textContent=message;for(const id of ['play','slow','seek','reset','side','angle'])$(id).disabled=true;};
const gl=canvas.getContext('webgl',{alpha:false,antialias:true,powerPreference:'low-power'});
if(!gl){fail('此浏览器暂不支持 3D 显示，请用 Safari、Chrome 或其他支持 WebGL 的浏览器打开。');return;}
const vs=`attribute vec3 aPosition;attribute vec3 aNormal;uniform mat4 uModel;uniform mat4 uViewProjection;uniform mat3 uNormal;varying vec3 vNormal;varying vec3 vWorld;void main(){vec4 p=uModel*vec4(aPosition,1.0);vWorld=p.xyz;vNormal=normalize(uNormal*aNormal);gl_Position=uViewProjection*p;}`;
const fs=`precision mediump float;varying vec3 vNormal;varying vec3 vWorld;uniform vec4 uColor;void main(){vec3 n=normalize(vNormal);float key=max(0.,dot(n,normalize(vec3(-2.,-4.,6.))));float fill=max(0.,dot(n,normalize(vec3(3.,2.,3.))));float light=.64+.32*key+.12*fill;vec3 color=uColor.rgb*light;gl_FragColor=vec4(color,uColor.a);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let program;try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));}catch(e){fail('3D 画面未能启动，请尝试在系统浏览器中重新打开此页面。');return;}
gl.useProgram(program);const loc={};for(const n of ['uModel','uViewProjection','uNormal','uColor'])loc[n]=gl.getUniformLocation(program,n);loc.p=gl.getAttribLocation(program,'aPosition');loc.n=gl.getAttribLocation(program,'aNormal');
const meshes=data.meshes.map(m=>{const buffers=[m.p,m.n,m.i].map((a,i)=>{const b=gl.createBuffer();gl.bindBuffer(i===2?gl.ELEMENT_ARRAY_BUFFER:gl.ARRAY_BUFFER,b);gl.bufferData(i===2?gl.ELEMENT_ARRAY_BUFFER:gl.ARRAY_BUFFER,i===2?new Uint16Array(a):new Float32Array(a),gl.STATIC_DRAW);return b;});return{buffers,count:m.i.length};});
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],norm=a=>{const l=Math.hypot(...a);return a.map(x=>x/l);};
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}
function view(eye,target){const z=norm(eye.map((n,i)=>n-target[i])),x=norm(cross([0,0,1],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);}
function ortho(w,h){return new Float32Array([2/w,0,0,0,0,2/h,0,0,0,0,-2/100,0,0,0,-1,1]);}
function transform(t){const [px,py,pz,x,y,z,w,sx,sy,sz]=t,xx=x*x,yy=y*y,zz=z*z,xy=x*y,xz=x*z,yz=y*z,wx=w*x,wy=w*y,wz=w*z;const r=[1-2*(yy+zz),2*(xy+wz),2*(xz-wy),2*(xy-wz),1-2*(xx+zz),2*(yz+wx),2*(xz+wy),2*(yz-wx),1-2*(xx+yy)];return{m:new Float32Array([r[0]*sx,r[1]*sx,r[2]*sx,0,r[3]*sy,r[4]*sy,r[5]*sy,0,r[6]*sz,r[7]*sz,r[8]*sz,0,px,py,pz,1]),n:new Float32Array([r[0]/sx,r[1]/sx,r[2]/sx,r[3]/sy,r[4]/sy,r[5]/sy,r[6]/sz,r[7]/sz,r[8]/sz])};}
function sample(ts,f){if(ts.length===1)return ts[0];const p=Math.min(1,f)*(ts.length-1),i=Math.min(ts.length-2,Math.floor(p)),u=p-i,a=ts[i],b=ts[i+1],t=a.map((v,j)=>v+(b[j]-v)*u);const sign=a.slice(3,7).reduce((s,v,j)=>s+v*b[j+3],0)<0?-1:1;let l=0;for(let j=3;j<7;j++){t[j]=a[j]*(1-u)+b[j]*u*sign;l+=t[j]*t[j];}l=Math.sqrt(l);for(let j=3;j<7;j++)t[j]/=l;return t;}
let yaw=-1.17,pitch=.19,zoom=1,progress=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,last=0,dirty=true,phase=-1;
function syncPlay(){$('play-text').textContent=playing?'暂停示范':'播放示范';$('play').setAttribute('aria-label',playing?'暂停动画':'播放动画');$('play-icon').setAttribute('d',playing?'M6 4h4v16H6zm8 0h4v16h-4z':'M7 3v18l14-9z');$('paused').hidden=playing;}
function syncPhase(){const p=progress<.5?0:1;if(p!==phase){phase=p;$('step').textContent=`动作 0${p+1} / 02`;$('phase').textContent=p?'伸肘，轻轻推回':'屈肘，缓慢靠近';$('cue').textContent=p?'双手推墙，回到起始姿势。':'双手稳稳贴墙，让身体整体向墙面靠近。';}$('seek').value=Math.round(progress*1000);$('seek').setAttribute('aria-valuetext',`${Math.round(progress*100)}%，${p?'推回':'靠近'}阶段`);}
function drawObject(o,alpha=1,custom=null){const mesh=meshes[o.g],t=transform(custom||sample(o.t,progress));gl.bindBuffer(gl.ARRAY_BUFFER,mesh.buffers[0]);gl.enableVertexAttribArray(loc.p);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,mesh.buffers[1]);gl.enableVertexAttribArray(loc.n);gl.vertexAttribPointer(loc.n,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.buffers[2]);gl.uniformMatrix4fv(loc.uModel,false,t.m);gl.uniformMatrix3fv(loc.uNormal,false,t.n);gl.uniform4f(loc.uColor,...o.c,alpha);gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);}
function render(){const width=canvas.clientWidth,height=canvas.clientHeight;if(!width||!height)return;const dpr=Math.min(devicePixelRatio||1,1.5),w=Math.round(width*dpr),h=Math.round(height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clearColor(.961,.957,.933,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);const target=[-.38,0,.92],eye=[target[0]+6*Math.cos(yaw)*Math.cos(pitch),6*Math.sin(yaw)*Math.cos(pitch),target[2]+6*Math.sin(pitch)];const span=Math.max(2.23,1.65/(width/height))/zoom;gl.uniformMatrix4fv(loc.uViewProjection,false,mul(ortho(span*width/height,span),view(eye,target)));
for(const o of data.objects)if(o.name==='Floor'||o.name==='Exercise mat')drawObject(o);
// Ground contact shadows use the same low-poly sphere mesh, flattened under the shoes.
const shadow={g:0,c:[.26,.34,.28]};gl.depthMask(false);for(const y of [-.13,.13])drawObject(shadow,.12,[-.87,y,.001,0,0,0,1,.18,.105,.001]);gl.depthMask(true);
for(const o of data.objects)if(!['Floor','Exercise mat','Wall','Wall rail'].includes(o.name))drawObject(o);
// Translucent wall keeps hands and posture visible from every angle.
gl.depthMask(false);gl.disable(gl.CULL_FACE);for(const o of data.objects)if(o.name==='Wall'||o.name==='Wall rail')drawObject(o,o.name==='Wall'?.24:.62);gl.depthMask(true);gl.enable(gl.CULL_FACE);}
$('play').onclick=()=>{playing=!playing;syncPlay();last=0;dirty=true;};$('slow').onclick=()=>{speed=speed===1?.5:1;$('slow').setAttribute('aria-pressed',speed===.5);$('timing').textContent=speed===1?'3 秒靠近 · 3 秒推回':'6 秒靠近 · 6 秒推回';};$('reset').onclick=()=>{progress=0;playing=true;last=0;dirty=true;syncPlay();syncPhase();};$('seek').oninput=e=>{progress=Number(e.target.value)/1000;playing=false;syncPlay();syncPhase();dirty=true;};
function setView(angle){yaw=angle;pitch=.19;zoom=1;dirty=true;$('side').setAttribute('aria-pressed',angle===-Math.PI/2);$('angle').setAttribute('aria-pressed',angle!==-Math.PI/2);}
$('side').onclick=()=>setView(-Math.PI/2);$('angle').onclick=()=>setView(-1.17);
const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);pinch=0;});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw-=(e.clientX-prev[0])*.009;pitch=Math.max(.035,Math.min(.65,pitch+(e.clientY-prev[1])*.006));}else{const a=[...pointers.values()],dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch)zoom=Math.max(.75,Math.min(1.5,zoom*dist/pinch));pinch=dist;}$('side').setAttribute('aria-pressed','false');$('angle').setAttribute('aria-pressed','false');dirty=true;});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=0;});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.75,Math.min(1.5,zoom*Math.exp(-e.deltaY*.001)));dirty=true;},{passive:false});canvas.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')yaw+=.12;else if(e.key==='ArrowRight')yaw-=.12;else if(e.key==='ArrowUp')pitch=Math.min(.65,pitch+.06);else if(e.key==='ArrowDown')pitch=Math.max(.035,pitch-.06);else return;e.preventDefault();dirty=true;});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();playing=false;syncPlay();fail('3D 显示已暂停，请重新打开页面恢复。');});document.addEventListener('visibilitychange',()=>{last=0;dirty=true;});new ResizeObserver(()=>{dirty=true;}).observe(canvas);
function tick(now){requestAnimationFrame(tick);if(document.hidden){last=0;return;}if(last&&now-last<1000/30)return;const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(playing){progress=(progress+dt*speed/6)%1;dirty=true;}if(dirty){syncPhase();render();dirty=false;}}syncPlay();syncPhase();requestAnimationFrame(tick);
})();
</script></body></html>
