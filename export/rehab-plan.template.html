<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>7 天呼吸与体能恢复计划</title>
  <style>
    @page {
      size: A4;
      margin: 16mm 14mm 16mm 14mm;
    }

    :root {
      color-scheme: light;
      --ink: #18222d;
      --muted: #5f6b78;
      --line: #d6dde4;
      --soft: #eef5f8;
      --brand: #1a6a73;
      --accent: #e7f5f3;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    html {
      font-size: 12pt;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: white;
      font-family: "Hiragino Sans GB", "PingFang SC", "Heiti SC", "Songti SC", "Noto Sans CJK SC", sans-serif;
      line-height: 1.65;
    }

    main.page {
      width: 100%;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      break-after: avoid;
      page-break-after: avoid;
      line-height: 1.25;
    }

    h1 {
      margin-bottom: 14mm;
      padding: 10mm 9mm;
      border-radius: 18px;
      background: linear-gradient(135deg, #e8f6f4 0%, #f7fbfc 100%);
      color: var(--brand);
      font-size: 24pt;
      letter-spacing: 0.02em;
    }

    h2 {
      margin-top: 9mm;
      margin-bottom: 4mm;
      padding: 4mm 4.5mm;
      border-left: 5px solid var(--brand);
      border-radius: 10px;
      background: var(--soft);
      font-size: 16.5pt;
    }

    h3 {
      margin-top: 5mm;
      margin-bottom: 3mm;
      color: #24485a;
      font-size: 13pt;
    }

    p,
    ul {
      margin: 0 0 4mm 0;
    }

    ul {
      padding-left: 1.35em;
    }

    li + li {
      margin-top: 1.5mm;
    }

    hr {
      margin: 5mm 0 4mm;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4mm;
      margin: 4mm 0 5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .image-card {
      margin: 0;
      padding: 3mm;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfdfe;
      box-shadow: 0 1.5mm 4mm rgba(19, 48, 58, 0.05);
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .image-card img {
      display: block;
      width: 100%;
      max-height: 58mm;
      object-fit: contain;
      border-radius: 8px;
      background: white;
    }

    .image-card.is-broken::before {
      content: "图片加载失败";
      display: block;
      padding: 18mm 4mm;
      border: 1px dashed #d9b3b3;
      border-radius: 8px;
      color: #9b4a4a;
      text-align: center;
      background: #fff7f7;
      font-size: 10.5pt;
    }

    .image-card.is-broken img {
      display: none;
    }

    strong {
      color: #0d5d68;
    }

    blockquote {
      margin: 4mm 0;
      padding: 4mm 4.5mm;
      border-left: 4px solid #72aab0;
      background: #f7fbfc;
      color: var(--muted);
    }

    h2:last-of-type + p {
      padding: 4.5mm 5mm;
      border-radius: 12px;
      background: var(--accent);
      font-size: 13pt;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="page">
    $body$
  </main>
  <script>
    (() => {
      const main = document.querySelector("main.page");
      if (!main) return;

      const isImageOnlyParagraph = (node) => {
        if (!node || node.tagName !== "P") return false;
        const meaningful = [...node.childNodes].filter((child) => {
          return child.nodeType !== Node.TEXT_NODE || child.textContent.trim() !== "";
        });
        return meaningful.length === 1 && meaningful[0].nodeType === Node.ELEMENT_NODE && meaningful[0].tagName === "IMG";
      };

      let current = main.firstElementChild;
      while (current) {
        if (!isImageOnlyParagraph(current)) {
          current = current.nextElementSibling;
          continue;
        }

        const grid = document.createElement("div");
        grid.className = "image-grid";
        main.insertBefore(grid, current);

        while (current && isImageOnlyParagraph(current)) {
          const next = current.nextElementSibling;
          const img = current.querySelector("img");
          const figure = document.createElement("figure");
          figure.className = "image-card";

          if (img) {
            img.loading = "eager";
            img.decoding = "sync";
            img.referrerPolicy = "no-referrer";
            img.addEventListener("error", () => figure.classList.add("is-broken"), { once: true });
            figure.appendChild(img);
          }

          grid.appendChild(figure);
          current.remove();
          current = next;
        }
      }
    })();
  </script>
</body>
</html>
